name: Check

on:
  push:
  pull_request:

jobs:
  userscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:check
      - run: bun run build:fork
      - run: git diff --exit-code -- release/PKU-Art.user.js

  transcription-service:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: video-text/requirements.txt
      - run: python -m pip install -r video-text/requirements.txt
      - run: python -m unittest discover -s video-text -p "test_*.py"
